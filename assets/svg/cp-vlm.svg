<svg viewBox="0 0 760 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="vl-t">
  <title id="vl-t">Vision–language models for pathology: an image encoder and a text encoder map tissue images and captions into a shared space. Zero-shot classification compares an image with text prompts; text-guided localization compares a prompt with every tile to produce a heatmap.</title>
  <defs><marker id="vl-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="d-ink3"/></marker></defs>
  <text x="20" y="28" font-size="15" font-weight="600" class="d-ink">Teaching models the words for what they see</text>
  <text x="20" y="46" font-size="12.5" class="d-ink3">Contrastive image–text pretraining (CLIP-style), as in PLIP and CONCH.</text>
  <!-- pairs -->
  <g font-size="11.5">
    <rect x="20" y="72" width="54" height="54" rx="5" fill="#f4c6da" stroke="#c98aab"/>
    <g fill="#3d2f7a" opacity="0.85"><circle cx="34" cy="86" r="5"/><circle cx="52" cy="92" r="6"/><circle cx="44" cy="110" r="5"/><circle cx="62" cy="112" r="4"/><circle cx="30" cy="114" r="3"/></g>
    <text x="84" y="92" class="d-ink2">“Glands with crowded,</text>
    <text x="84" y="107" class="d-ink2">hyperchromatic nuclei;</text>
    <text x="84" y="122" class="d-ink2">adenocarcinoma.”</text>
    <rect x="20" y="146" width="54" height="54" rx="5" fill="#f7d4e3" stroke="#c98aab"/>
    <g fill="#5a4aa0" opacity="0.8"><circle cx="34" cy="160" r="3"/><circle cx="56" cy="166" r="3"/><circle cx="40" cy="186" r="3"/><circle cx="62" cy="190" r="3"/></g>
    <text x="84" y="166" class="d-ink2">“Benign colonic mucosa</text>
    <text x="84" y="181" class="d-ink2">with orderly crypts.”</text>
    <text x="20" y="228" class="d-ink3">…millions of image–caption pairs</text>
    <text x="20" y="243" class="d-ink3">from textbooks, papers, reports,</text>
    <text x="20" y="258" class="d-ink3">and educational videos</text>
  </g>
  <!-- encoders -->
  <path d="M236 100 H268" class="d-ink3-s" stroke-width="1.5" marker-end="url(#vl-a)"/>
  <path d="M236 172 H268" class="d-ink3-s" stroke-width="1.5" marker-end="url(#vl-a)"/>
  <rect x="272" y="80" width="104" height="40" rx="8" class="d-navy"/><text x="324" y="105" text-anchor="middle" font-size="12" font-weight="700" class="d-bg">image encoder</text>
  <rect x="272" y="152" width="104" height="40" rx="8" class="d-s3"/><text x="324" y="177" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">text encoder</text>
  <path d="M380 100 C410 100 420 130 440 136" class="d-ink3-s" stroke-width="1.5" fill="none" marker-end="url(#vl-a)"/>
  <path d="M380 172 C410 172 420 148 440 142" class="d-ink3-s" stroke-width="1.5" fill="none" marker-end="url(#vl-a)"/>
  <!-- shared space -->
  <circle cx="500" cy="140" r="58" class="d-sunk d-rule-s" stroke-width="1"/>
  <text x="500" y="72" text-anchor="middle" font-size="11.5" class="d-ink3">shared embedding space</text>
  <g><circle cx="482" cy="122" r="6" class="d-navy"/><circle cx="492" cy="128" r="6" class="d-s3"/><path d="M482 122 L492 128" class="d-accent-s" stroke-width="2"/></g>
  <g><circle cx="520" cy="166" r="6" class="d-navy"/><circle cx="528" cy="156" r="6" class="d-s3"/><path d="M520 166 L528 156" class="d-accent-s" stroke-width="2"/></g>
  <text x="500" y="214" text-anchor="middle" font-size="11" class="d-ink3">matching pairs pulled together,</text>
  <text x="500" y="228" text-anchor="middle" font-size="11" class="d-ink3">mismatches pushed apart</text>
  <!-- uses -->
  <rect x="588" y="72" width="160" height="100" rx="10" class="d-bg d-rule-s"/>
  <text x="600" y="92" font-size="12" font-weight="700" class="d-ink">Zero-shot classification</text>
  <text x="600" y="110" font-size="11" class="d-ink2">compare a slide with</text>
  <text x="600" y="124" font-size="11" class="d-ink2">prompts like “an image of</text>
  <text x="600" y="138" font-size="11" class="d-ink2">adenocarcinoma” vs “benign”;</text>
  <text x="600" y="152" font-size="11" class="d-ink2">no task-specific training</text>
  <rect x="588" y="184" width="160" height="128" rx="10" class="d-bg d-rule-s"/>
  <text x="600" y="204" font-size="12" font-weight="700" class="d-ink">Text-guided localization</text>
  <text x="600" y="222" font-size="11" class="d-ink2">score every tile against</text>
  <text x="600" y="236" font-size="11" class="d-ink2">a prompt to get a heatmap</text>
  <g>
    <rect x="610" y="248" width="16" height="16" fill="#f4c6da"/><rect x="627" y="248" width="16" height="16" fill="#b3263e" opacity="0.35"/><rect x="644" y="248" width="16" height="16" fill="#b3263e" opacity="0.8"/><rect x="661" y="248" width="16" height="16" fill="#b3263e" opacity="0.55"/>
    <rect x="610" y="265" width="16" height="16" fill="#f4c6da"/><rect x="627" y="265" width="16" height="16" fill="#b3263e" opacity="0.2"/><rect x="644" y="265" width="16" height="16" fill="#b3263e" opacity="0.65"/><rect x="661" y="265" width="16" height="16" fill="#f4c6da"/>
    <rect x="610" y="282" width="16" height="16" fill="#f4c6da"/><rect x="627" y="282" width="16" height="16" fill="#f4c6da"/><rect x="644" y="282" width="16" height="16" fill="#b3263e" opacity="0.25"/><rect x="661" y="282" width="16" height="16" fill="#f4c6da"/>
  </g>
  <text x="686" y="278" font-size="10.5" class="d-ink3">“tumor”</text>
  <path d="M558 128 H584" class="d-ink3-s" stroke-width="1.3" marker-end="url(#vl-a)"/>
  <path d="M552 168 C566 190 572 220 584 228" class="d-ink3-s" stroke-width="1.3" fill="none" marker-end="url(#vl-a)"/>
  <text x="20" y="324" font-size="11.5" class="d-ink3">Schematic. Real models use hundreds of dimensions and contrast each image against many captions at once.</text>
</svg>
