<svg viewBox="0 0 760 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ga-t">
  <title id="ga-t">How a GalNAc-conjugated siRNA reaches the liver and lasts for months: a chemically stabilized siRNA carries a three-armed sugar that binds the ASGPR receptor on hepatocytes; it is taken up into endosomes, a small fraction escapes into the cytoplasm, loads into the RISC complex, and silences the target mRNA for months.</title>
  <defs><marker id="ga-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="d-ink3"/></marker></defs>
  <text x="20" y="28" font-size="15" font-weight="600" class="d-ink">Why a twice-yearly injection can work</text>
  <text x="20" y="46" font-size="12.5" class="d-ink3">A GalNAc-conjugated siRNA from injection to silencing (schematic).</text>
  <!-- 1 molecule -->
  <g>
    <line x1="34" y1="104" x2="164" y2="104" class="d-s2-s" stroke-width="5" stroke-linecap="round"/>
    <line x1="34" y1="116" x2="150" y2="116" class="d-s1-s" stroke-width="5" stroke-linecap="round"/>
    <g class="d-gold"><circle cx="54" cy="104" r="3"/><circle cx="84" cy="104" r="3"/><circle cx="114" cy="104" r="3"/><circle cx="144" cy="104" r="3"/><circle cx="64" cy="116" r="3"/><circle cx="104" cy="116" r="3"/></g>
    <path d="M164 104 L178 110 M178 110 L192 96 M178 110 L194 110 M178 110 L192 124" class="d-ink3-s" stroke-width="1.5"/>
    <g class="d-s3"><circle cx="196" cy="94" r="6"/><circle cx="199" cy="110" r="6"/><circle cx="196" cy="126" r="6"/></g>
    <text x="34" y="150" font-size="12" font-weight="600" class="d-ink">1 · Engineered siRNA</text>
    <text x="34" y="166" font-size="11" class="d-ink3">21–23-nt strands; nearly every</text>
    <text x="34" y="180" font-size="11" class="d-ink3">sugar chemically modified</text>
    <text x="34" y="194" font-size="11" class="d-ink3"><tspan class="d-gold" font-weight="700">●</tspan> 2′-F / 2′-OMe, PS linkages</text>
    <text x="34" y="208" font-size="11" class="d-ink3"><tspan class="d-s3" font-weight="700">●</tspan> triantennary GalNAc ligand</text>
  </g>
  <!-- 2 hepatocyte -->
  <path d="M214 110 H252" class="d-ink3-s" stroke-width="1.5" marker-end="url(#ga-a)"/>
  <rect x="258" y="66" width="480" height="210" rx="26" class="d-teal-soft d-s3-s" stroke-width="1.5"/>
  <text x="276" y="88" font-size="11.5" letter-spacing="1.4" class="t-mono d-ink3">HEPATOCYTE</text>
  <g>
    <path d="M266 100 v24" class="d-s3-s" stroke-width="3"/><path d="M262 100 h8" class="d-s3-s" stroke-width="3"/>
    <text x="280" y="116" font-size="12" font-weight="600" class="d-ink">2 · ASGPR binding</text>
    <text x="280" y="131" font-size="11" class="d-ink3">a receptor found almost</text>
    <text x="280" y="145" font-size="11" class="d-ink3">only on liver cells</text>
  </g>
  <path d="M330 154 C330 180 360 200 390 200" class="d-ink3-s" stroke-width="1.5" fill="none" marker-end="url(#ga-a)"/>
  <g>
    <circle cx="420" cy="196" r="30" class="d-bg d-ink3-s" stroke-width="1.5"/>
    <line x1="404" y1="190" x2="436" y2="190" class="d-s2-s" stroke-width="3"/><line x1="404" y1="198" x2="430" y2="198" class="d-s1-s" stroke-width="3"/>
    <line x1="410" y1="208" x2="438" y2="208" class="d-s2-s" stroke-width="3"/>
    <text x="420" y="246" text-anchor="middle" font-size="12" font-weight="600" class="d-ink">3 · Endosome</text>
    <text x="420" y="261" text-anchor="middle" font-size="11" class="d-ink3">a slow-release depot</text>
  </g>
  <path d="M452 190 H492" class="d-ink3-s" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ga-a)"/>
  <text x="472" y="180" text-anchor="middle" font-size="10.5" class="d-ink3">escape</text>
  <g>
    <ellipse cx="540" cy="190" rx="38" ry="24" class="d-s2" opacity="0.18"/>
    <ellipse cx="540" cy="190" rx="38" ry="24" fill="none" class="d-s2-s" stroke-width="1.5"/>
    <line x1="518" y1="190" x2="562" y2="190" class="d-s1-s" stroke-width="3"/>
    <text x="540" y="230" text-anchor="middle" font-size="12" font-weight="600" class="d-ink">4 · RISC loading</text>
    <text x="540" y="245" text-anchor="middle" font-size="11" class="d-ink3">guide strand retained;</text>
    <text x="540" y="259" text-anchor="middle" font-size="11" class="d-ink3">RISC is catalytic</text>
  </g>
  <path d="M580 186 H614" class="d-ink3-s" stroke-width="1.5" marker-end="url(#ga-a)"/>
  <g>
    <line x1="624" y1="170" x2="664" y2="170" class="d-s1-s" stroke-width="4"/><line x1="672" y1="170" x2="712" y2="170" class="d-s1-s" stroke-width="4"/>
    <path d="M662 160 L674 180 M674 160 L662 180" class="d-accent-s" stroke-width="2"/>
    <text x="668" y="206" text-anchor="middle" font-size="12" font-weight="600" class="d-ink">5 · Target mRNA cut</text>
    <text x="668" y="221" text-anchor="middle" font-size="11" class="d-ink3">e.g. PCSK9 or TTR;</text>
    <text x="668" y="235" text-anchor="middle" font-size="11" class="d-ink3">protein falls for months</text>
  </g>
  <text x="20" y="302" font-size="11.5" class="d-ink3">Stabilizing chemistry, a hepatocyte-specific receptor, and a catalytic, long-lived RISC</text>
  <text x="20" y="318" font-size="11.5" class="d-ink3">together turn a 3-weekly IV infusion into a twice-yearly shot.</text>
</svg>
