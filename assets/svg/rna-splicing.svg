<svg viewBox="0 0 760 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sp-t">
  <title id="sp-t">Splicing. A pre-mRNA with four exons and three introns is spliced; including or skipping exon 3 produces two different mRNA isoforms from one gene.</title>
  <defs><marker id="sp-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="d-ink3"/></marker></defs>
  <text x="20" y="30" font-size="12" class="t-mono d-ink3">PRE-mRNA (in the nucleus)</text>
  <g>
    <line x1="20" y1="70" x2="740" y2="70" class="d-ink3-s" stroke-width="2"/>
    <rect x="20" y="54" width="110" height="32" rx="5" class="d-s1"/><text x="75" y="75" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">exon 1</text>
    <rect x="240" y="54" width="100" height="32" rx="5" class="d-s1"/><text x="290" y="75" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">exon 2</text>
    <rect x="440" y="54" width="70" height="32" rx="5" class="d-s2"/><text x="475" y="75" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">exon 3</text>
    <rect x="620" y="54" width="120" height="32" rx="5" class="d-s1"/><text x="680" y="75" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">exon 4</text>
    <g font-size="11" class="t-mono d-ink3" text-anchor="middle">
      <text x="185" y="104">intron</text><text x="390" y="104">intron</text><text x="565" y="104">intron</text>
      <text x="140" y="64">GU</text><text x="230" y="64">AG</text>
    </g>
  </g>
  <!-- splice paths -->
  <g fill="none" stroke-width="1.5">
    <path d="M130 50 Q185 18 240 50" class="d-ink3-s"/>
    <path d="M340 50 Q390 18 440 50" class="d-ink3-s"/>
    <path d="M510 50 Q565 18 620 50" class="d-ink3-s"/>
    <path d="M340 90 Q480 140 620 90" class="d-accent-s" stroke-dasharray="5 4"/>
  </g>
  <text x="480" y="136" text-anchor="middle" font-size="11.5" class="d-accent">alternative choice: skip exon 3</text>
  <path d="M380 150 V178" class="d-ink3-s" stroke-width="1.5" marker-end="url(#sp-a)"/>
  <text x="392" y="168" font-size="12" class="d-ink2">the spliceosome removes introns</text>
  <text x="20" y="208" font-size="12" class="t-mono d-ink3">MATURE mRNAs (exported to the cytoplasm)</text>
  <g>
    <text x="20" y="243" font-size="12.5" font-weight="600" class="d-ink">Isoform A</text>
    <rect x="110" y="226" width="110" height="26" rx="4" class="d-s1"/>
    <rect x="222" y="226" width="100" height="26" rx="4" class="d-s1"/>
    <rect x="324" y="226" width="70" height="26" rx="4" class="d-s2"/>
    <rect x="396" y="226" width="120" height="26" rx="4" class="d-s1"/>
    <text x="530" y="243" font-size="12" class="d-ink3">includes exon 3 → protein variant A</text>
    <text x="20" y="289" font-size="12.5" font-weight="600" class="d-ink">Isoform B</text>
    <rect x="110" y="272" width="110" height="26" rx="4" class="d-s1"/>
    <rect x="222" y="272" width="100" height="26" rx="4" class="d-s1"/>
    <rect x="324" y="272" width="120" height="26" rx="4" class="d-s1"/>
    <text x="458" y="289" font-size="12" class="d-ink3">skips exon 3 → protein variant B</text>
  </g>
  <text x="20" y="322" font-size="11.5" class="d-ink3">More than 90% of human multi-exon genes make more than one isoform.</text>
</svg>
