<svg viewBox="0 0 760 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ht-t">
  <title id="ht-t">Three findings from my PhD. Inside a cardiomyocyte, METTL3 writes m6A on mRNA. The position of m6A tracks with protein output; m6A stabilizes FGF1 mRNA, which signals to fat tissue; and the reader YTHDF3 drives stress-induced protein synthesis and cardiomyocyte growth.</title>
  <defs><marker id="ht-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="d-ink3"/></marker></defs>
  <!-- cardiomyocyte -->
  <rect x="14" y="40" width="480" height="300" rx="40" class="d-accent-soft d-accent-s" stroke-width="1.5"/>
  <g class="d-accent-s" stroke-width="1" opacity="0.35">
    <line x1="60" y1="52" x2="60" y2="328"/><line x1="100" y1="46" x2="100" y2="334"/><line x1="410" y1="46" x2="410" y2="334"/><line x1="450" y1="52" x2="450" y2="328"/>
  </g>
  <text x="34" y="30" font-size="12" letter-spacing="1.4" class="t-mono d-ink3">CARDIOMYOCYTE</text>
  <!-- METTL3 -->
  <rect x="160" y="66" width="190" height="38" rx="19" class="d-bg d-ink-s" stroke-width="1.5"/>
  <text x="255" y="90" text-anchor="middle" font-size="13" class="d-ink"><tspan font-weight="700">METTL3</tspan> writes m6A</text>
  <path d="M255 106 V132" class="d-ink3-s" stroke-width="1.5" marker-end="url(#ht-a)"/>
  <!-- mRNA -->
  <line x1="120" y1="160" x2="400" y2="160" class="d-ink3-s" stroke-width="3" stroke-linecap="round"/>
  <rect x="160" y="150" width="120" height="20" rx="4" class="d-navy"/>
  <text x="220" y="164.5" text-anchor="middle" font-size="10" letter-spacing="1" class="t-mono d-bg">CDS</text>
  <text x="340" y="182" text-anchor="middle" font-size="10.5" class="t-mono d-ink3">3′ UTR</text>
  <g class="d-accent-s" stroke-width="2"><line x1="230" y1="150" x2="230" y2="138"/><line x1="330" y1="160" x2="330" y2="138"/></g>
  <g class="d-accent"><circle cx="230" cy="134" r="5.5"/><circle cx="330" cy="134" r="5.5"/></g>
  <!-- finding 1 -->
  <g>
    <circle cx="44" cy="214" r="12" class="d-accent"/><text x="44" y="218.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">1</text>
    <text x="64" y="212" font-size="13" font-weight="700" class="d-ink">Position matters</text>
    <text x="64" y="229" font-size="11.5" class="d-ink2">Nanopore maps: CDS vs 3′ UTR m6A</text>
    <text x="64" y="244" font-size="11.5" class="d-ink2">tracks with protein output; targets</text>
    <text x="64" y="259" font-size="11.5" class="d-ink2">in mitochondrial metabolism</text>
    <text x="64" y="276" font-size="11" class="t-mono d-ink3">Circulation 2024</text>
  </g>
  <!-- finding 3 -->
  <g>
    <circle cx="278" cy="214" r="12" class="d-accent"/><text x="278" y="218.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">3</text>
    <text x="298" y="212" font-size="13" font-weight="700" class="d-ink">YTHDF3 under stress</text>
    <text x="298" y="229" font-size="11.5" class="d-ink2">reads m6A, drives stress-induced</text>
    <text x="298" y="244" font-size="11.5" class="d-ink2">protein synthesis and cell growth;</text>
    <text x="298" y="259" font-size="11.5" class="d-ink2">its loss blunts remodeling after</text>
    <text x="298" y="274" font-size="11.5" class="d-ink2">pressure overload</text>
    <text x="298" y="291" font-size="11" class="t-mono d-ink3">RNA 2025</text>
  </g>
  <!-- FGF1 -->
  <rect x="340" y="304" width="132" height="26" rx="13" class="d-bg d-s4-s" stroke-width="1.5"/>
  <text x="406" y="321" text-anchor="middle" font-size="12" class="d-ink"><tspan font-style="italic">FGF1</tspan> mRNA stable</text>
  <path d="M476 317 C520 317 560 302 592 280" class="d-s4-s" stroke-width="2" fill="none" marker-end="url(#ht-a)"/>
  <text x="486" y="346" font-size="11.5" class="d-ink3">FGF1 secreted</text>
  <!-- fat -->
  <g>
    <text x="548" y="30" font-size="12" letter-spacing="1.4" class="t-mono d-ink3">ADIPOSE TISSUE</text>
    <circle cx="560" cy="60" r="12" class="d-accent"/><text x="560" y="64.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">2</text>
    <text x="580" y="65" font-size="13" font-weight="700" class="d-ink">Heart-to-fat signal</text>
    <text x="548" y="90" font-size="11.5" class="d-ink2">On a Western diet: more cardiac</text>
    <text x="548" y="105" font-size="11.5" class="d-ink2">METTL3 → more weight gain and</text>
    <text x="548" y="120" font-size="11.5" class="d-ink2">glucose intolerance; none → protected</text>
    <text x="548" y="138" font-size="11" class="t-mono d-ink3">JCI Insight 2025</text>
    <g class="d-gold-soft d-s4-s" stroke-width="1.5">
      <circle cx="604" cy="196" r="28"/><circle cx="668" cy="186" r="30"/><circle cx="724" cy="214" r="24"/><circle cx="632" cy="256" r="30"/><circle cx="694" cy="262" r="28"/><circle cx="742" cy="270" r="14"/>
    </g>
  </g>
  <text x="14" y="388" font-size="11.5" class="d-ink3">Mouse studies with cardiomyocyte-specific gain or loss of function; see the papers for full methods and caveats.</text>
</svg>
