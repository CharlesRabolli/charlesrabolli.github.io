{{- $id := .Get "id" -}}
{{- $title := .Get "title" -}}
{{- $start := .Get "start" | default "0" -}}
<figure class="video">
  <div class="yt" data-id="{{ $id }}" data-start="{{ $start }}" data-title="{{ $title }}">
    <img src="https://i.ytimg.com/vi/{{ $id }}/hqdefault.jpg" alt="" loading="lazy" decoding="async">
    <button type="button" class="yt__play" aria-label="Play video: {{ $title }}">
      <svg viewBox="0 0 68 48" width="68" height="48" aria-hidden="true"><path d="M66.5 7.7c-.8-2.9-2.5-5.4-5.4-6.2C55.8.1 34 0 34 0S12.2.1 6.9 1.6c-3 .7-4.6 3.2-5.4 6.1C.1 13 0 24 0 24s.1 11 1.5 16.3c.8 2.9 2.5 5.4 5.4 6.2C12.2 47.9 34 48 34 48s21.8-.1 27.1-1.6c3-.8 4.6-3.2 5.4-6.1C67.9 35 68 24 68 24s-.1-11-1.5-16.3z" fill="currentColor"/><path d="M45 24 27 14v20" fill="#fff"/></svg>
    </button>
  </div>
  <figcaption>
    <span class="video__title">{{ $title }}</span>
    {{ with .Get "who" }}<span class="video__who">{{ . }}</span>{{ end }}
    {{ with .Inner }}<span class="video__note">{{ . | $.Page.RenderString }}</span>{{ end }}
    <a class="video__link" href="https://www.youtube.com/watch?v={{ $id }}{{ if ne $start "0" }}&t={{ $start }}s{{ end }}" rel="noopener">watch on YouTube ↗</a>
  </figcaption>
</figure>
